<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahnyth</title>
<meta name="description" content="Small, careful apps by Ahnyth.">
<style>
  :root { --bg: #100d26; --card: #1c1840; --ink: #f4f1ff; --muted: #b3acd9; --accent: #ffd36b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 70% -10%, #2a2160 0%, var(--bg) 60%);
         color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px; }
  h1 { font-size: 40px; margin: 0 0 4px; letter-spacing: -0.5px; }
  p.lead { color: var(--muted); margin: 0 0 40px; }
  .app { display: block; background: var(--card); border-radius: 20px; padding: 20px 22px; text-decoration: none; color: inherit;
         border: 1px solid #2d2766; }
  .app h2 { margin: 0 0 4px; font-size: 20px; }
  .app p { margin: 0; color: var(--muted); }
  .links { margin-top: 12px; font-size: 15px; }
  .links a { color: var(--accent); }
  footer { margin-top: 56px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Ahnyth</h1>
  <p class="lead">Small, careful apps.</p>
  <div class="app">
    <h2>Qaza – Track Missed Prayers</h2>
    <p>Make up missed prayers one by one: hold the card, swipe for more, celebrate. Free, no account with us: your entries stay on your phone or in your own Google Drive.</p>
    <div class="links"><a href="qaza/privacy/">Privacy policy · Datenschutzerklärung</a></div>
  </div>
  <footer>Contact: <a href="mailto:gfgnp2w@gmail.com" style="color: var(--accent)">gfgnp2w@gmail.com</a></footer>
</main>
</body>
</html>
